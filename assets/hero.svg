<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Gividu Elladeniya — Full Stack Developer, Colombo Sri Lanka">
  <title>Gividu Elladeniya — Full Stack Developer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#16161e"/>
      <stop offset="55%"  stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#1f2130"/>
    </linearGradient>

    <radialGradient id="auroraA">
      <stop offset="0%"   stop-color="#7aa2f7" stop-opacity=".60"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB">
      <stop offset="0%"   stop-color="#bb9af7" stop-opacity=".52"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraC">
      <stop offset="0%"   stop-color="#7dcfff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c0caf5"/>
      <stop offset="55%"  stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7aa2f7"/>
      <stop offset="60%"  stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#7aa2f7" stop-opacity=".9"/>
      <stop offset="65%"  stop-color="#bb9af7" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#c0caf5" opacity=".07"/>
    </pattern>

    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>

    <clipPath id="card">
      <rect width="1200" height="280" rx="18"/>
    </clipPath>

    <style>
      .drift-a { animation: driftA 19s ease-in-out infinite; }
      .drift-b { animation: driftB 23s ease-in-out infinite; }
      .drift-c { animation: driftC 17s ease-in-out infinite; }
      @keyframes driftA {
        0%,100% { transform: translate(0,0)      scale(1); }
        50%     { transform: translate(90px,26px) scale(1.16); }
      }
      @keyframes driftB {
        0%,100% { transform: translate(0,0)        scale(1.06); }
        50%     { transform: translate(-74px,-30px) scale(.9); }
      }
      @keyframes driftC {
        0%,100% { transform: translate(0,0)       scale(.95); }
        50%     { transform: translate(46px,-40px) scale(1.2); }
      }

      .spin-slow { animation: spin 26s linear infinite;         transform-origin: 1006px 140px; }
      .spin-rev  { animation: spin 34s linear infinite reverse; transform-origin: 1006px 140px; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .pulse { animation: pulse 3.4s ease-in-out infinite; }
      @keyframes pulse {
        0%,100% { opacity: 1;   r: 5; }
        50%     { opacity: .55; r: 7; }
      }

      .rise { animation: rise .9s cubic-bezier(.16,.84,.44,1) both; }
      .rise-2 { animation-delay: .14s; }
      .rise-3 { animation-delay: .26s; }
      .rise-4 { animation-delay: .38s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .grow { animation: grow 1.1s cubic-bezier(.16,.84,.44,1) .34s both; transform-origin: 74px 178px; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

      .name { font: 700 54px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; letter-spacing: -1px; }
      .role { font: 600 19px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; letter-spacing: .2px; }
      .meta { font: 400 14.5px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; letter-spacing: .3px; }
      .chip { font: 600 12.5px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; letter-spacing: .4px; }

      @media (prefers-reduced-motion: reduce) {
        .drift-a, .drift-b, .drift-c, .spin-slow, .spin-rev, .pulse,
        .rise, .grow { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="url(#bg)"/>

    <!-- drifting aurora field -->
    <g filter="url(#soften)">
      <ellipse class="drift-a" cx="205" cy="90"  rx="230" ry="150" fill="url(#auroraA)"/>
      <ellipse class="drift-b" cx="700" cy="235" rx="270" ry="140" fill="url(#auroraB)"/>
      <ellipse class="drift-c" cx="1010" cy="70" rx="215" ry="145" fill="url(#auroraC)"/>
    </g>

    <rect width="1200" height="280" fill="url(#dots)"/>

    <!-- orbit motif -->
    <g opacity=".85">
      <circle cx="1006" cy="140" r="82"  fill="none" stroke="#7aa2f7" stroke-opacity=".22" stroke-width="1.25"/>
      <circle cx="1006" cy="140" r="56"  fill="none" stroke="#bb9af7" stroke-opacity=".26" stroke-width="1.25"/>
      <circle cx="1006" cy="140" r="110" fill="none" stroke="#7dcfff" stroke-opacity=".14" stroke-width="1.25"/>

      <g class="spin-slow">
        <circle cx="1088" cy="140" r="4.5" fill="#7aa2f7"/>
        <circle cx="1006" cy="30"  r="3"   fill="#7dcfff" opacity=".8"/>
      </g>
      <g class="spin-rev">
        <circle cx="950"  cy="140" r="3.5" fill="#bb9af7"/>
      </g>

      <circle class="pulse" cx="1006" cy="140" r="5" fill="#c0caf5"/>
    </g>

    <!-- copy -->
    <g class="rise">
      <text x="74" y="128" class="name" fill="url(#nameFill)">Gividu Elladeniya</text>
    </g>

    <g class="rise rise-2">
      <text x="76" y="162" class="role" fill="#7aa2f7">Full Stack Developer</text>
      <text x="264" y="162" class="role" fill="#565f89">/</text>
      <text x="280" y="162" class="role" fill="#9aa5ce">Colombo, Sri Lanka</text>
    </g>

    <rect class="grow" x="74" y="178" width="176" height="2.5" rx="1.25" fill="url(#rule)"/>

    <g class="rise rise-3">
      <text x="74" y="216" class="meta" fill="#7e88b3">
        React<tspan fill="#4a5178">  ·  </tspan>Vue<tspan fill="#4a5178">  ·  </tspan>Spring Boot<tspan fill="#4a5178">  ·  </tspan>Node.js<tspan fill="#4a5178">  ·  </tspan>Kotlin
      </text>
    </g>

    <g class="rise rise-4">
      <rect x="74" y="234" width="152" height="24" rx="12" fill="#7aa2f7" fill-opacity=".12" stroke="#7aa2f7" stroke-opacity=".35"/>
      <circle cx="90" cy="246" r="4" fill="#9ece6a"/>
      <text x="102" y="250" class="chip" fill="#9ece6a">open to work</text>
    </g>

    <rect y="0" width="1200" height="1.5" fill="url(#topline)"/>
    <rect width="1200" height="280" rx="18" fill="none" stroke="#292e42" stroke-width="1.5"/>
  </g>
</svg>
